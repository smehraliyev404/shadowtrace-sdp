services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shadowtrace-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI & REST API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: shadowtrace-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - ./collector:/etc/otelcol-contrib/output
    depends_on:
      - jaeger

  # Local/dev Mongo only - each teammate's own sandbox, not shared data.
  # The team's common live dataset lives on MongoDB Atlas (see .env.example
  # and the "MongoDB: shared team database setup" section at the end of
  # README.md for the one-time cluster setup); every
  # script picks Atlas automatically once MONGO_URI is set in .env, and
  # falls back to this local container otherwise.
  mongodb:
    image: mongo:8.0
    container_name: shadowtrace-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: