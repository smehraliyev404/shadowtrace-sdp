<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowTrace — Architecture, Progress, Publication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1418;
  --ink2:#0E1D24;
  --panel:#122631;
  --panel2:#16303C;
  --stroke:#204353;
  --text:#DCEDF3;
  --muted:#7FA0AE;
  --dim:#4E7284;
  --sig:#4FE0C0;        /* structural signal that survives redaction */
  --pii:#FF8C42;        /* payload / sensitive content */
  --alarm:#FF5F6D;      /* gap, blocker, missed deadline */
  --gold:#F3C053;       /* partial / in progress */
  --violet:#9F8BF5;     /* external literature / baseline */
  --shadow:0 18px 44px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -8%, #14313D 0%, transparent 62%),
    radial-gradient(900px 600px at 96% 8%, #16232B 0%, transparent 58%),
    var(--ink);
  color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}

header{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--stroke);
  background:linear-gradient(180deg,rgba(18,38,49,.95),rgba(10,20,24,.9));
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;
  letter-spacing:-.4px;margin:0;white-space:nowrap;
}
.brand h1 .glyph{color:var(--sig)}
.brand span{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

nav{display:flex;gap:4px;background:rgba(0,0,0,.28);padding:4px;border-radius:11px;border:1px solid var(--stroke)}
nav button{
  border:0;background:transparent;color:var(--muted);
  padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:500;
  transition:background .18s,color .18s;white-space:nowrap;
}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke)}

.tools{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{
  border:1px solid var(--stroke);background:rgba(0,0,0,.22);color:var(--muted);
  padding:6px 12px;border-radius:999px;font-size:12.5px;transition:.18s;
}
.chip:hover{border-color:var(--dim);color:var(--text)}
.chip[aria-pressed="true"]{background:rgba(79,224,192,.12);border-color:var(--sig);color:var(--sig)}
.chip.warn[aria-pressed="true"]{background:rgba(255,140,66,.13);border-color:var(--pii);color:var(--pii)}

/* ---------- body ---------- */
.stage{flex:1;display:flex;min-height:0;position:relative}
.canvas-wrap{flex:1;position:relative;min-width:0;overflow:hidden}
svg.canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.canvas.dragging{cursor:grabbing}
.view{display:none;height:100%}
.view.active{display:block}

.hint{
  position:absolute;left:16px;bottom:14px;z-index:4;
  font-size:11.5px;color:var(--dim);font-family:"IBM Plex Mono",monospace;
  background:rgba(10,20,24,.78);border:1px solid var(--stroke);
  padding:5px 10px;border-radius:7px;pointer-events:none;
}
.zoombar{position:absolute;right:16px;bottom:14px;z-index:4;display:flex;gap:6px}
.zoombar button{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--stroke);
  background:rgba(10,20,24,.85);color:var(--muted);font-size:15px;line-height:1;
}
.zoombar button:hover{color:var(--sig);border-color:var(--sig)}
.zoombar button.wide{width:auto;padding:0 12px;font-size:12px}

/* ---------- inspector ---------- */
aside{
  width:360px;flex:none;border-left:1px solid var(--stroke);
  background:linear-gradient(180deg,rgba(18,38,49,.62),rgba(10,20,24,.94));
  overflow-y:auto;padding:20px 20px 40px;
}
aside h2{
  font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:600;
  margin:0 0 4px;letter-spacing:-.2px;line-height:1.25;
}
.i-kicker{font-size:11.5px;color:var(--dim);font-family:"IBM Plex Mono",monospace;margin-bottom:14px;word-break:break-all}
.i-status{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:999px;margin-bottom:14px;border:1px solid currentColor;
}
.i-status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
aside p{margin:0 0 14px;color:#B9D3DD;font-size:13.8px;line-height:1.62}
aside .lab{
  font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.09em;
  margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--stroke);
}
aside ul{margin:0 0 4px;padding-left:17px}
aside li{margin:0 0 8px;font-size:13.3px;color:#B9D3DD;line-height:1.55}
aside li b{color:var(--text);font-weight:600}
aside code,.mono{font-family:"IBM Plex Mono",monospace;font-size:12.4px;color:var(--sig)}
aside a{color:var(--sig);text-decoration:none;border-bottom:1px solid rgba(79,224,192,.35)}
aside a:hover{border-bottom-color:var(--sig)}
.empty{color:var(--dim);font-size:13.5px;line-height:1.7}
.metric{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(32,67,83,.8);font-size:13px}
.metric span:first-child{color:var(--muted)}
.metric span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--text);text-align:right}

/* ---------- svg primitives ---------- */
.grid-line{stroke:rgba(32,67,83,.36);stroke-width:1}
.band-frame{fill:rgba(18,38,49,.34);stroke:var(--stroke);stroke-width:1;rx:14}
.band-label{
  font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:600;
  fill:var(--muted);letter-spacing:.02em;
}
.band-note{
  font-size:11.6px;fill:var(--dim);font-family:"IBM Plex Mono",monospace;
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.4px;stroke-linejoin:round;
}

.group-frame{fill:rgba(22,48,60,.28);stroke:rgba(32,67,83,.9);stroke-width:1;stroke-dasharray:5 5;rx:12}
.group-label{
  font-size:11.4px;font-family:"IBM Plex Mono",monospace;fill:var(--dim);letter-spacing:.06em;
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.4px;stroke-linejoin:round;
}

.node{cursor:pointer}
.node-bg{fill:var(--panel);rx:10;transition:fill .18s}
.node:hover .node-bg{fill:var(--panel2)}
.node-edge{fill:none;stroke-width:1.7;rx:10;stroke-dasharray:11 6;}
.animate .node-edge{animation:ants 2.6s linear infinite}
@keyframes ants{to{stroke-dashoffset:-34}}
.node-halo{fill:none;stroke-width:1;rx:14;opacity:0;transition:opacity .2s}
.node.sel .node-halo{opacity:.55}
.node.sel .node-edge{stroke-width:2.6}
.n-title{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:600;fill:var(--text)}
.n-sub{font-size:11.2px;font-family:"IBM Plex Mono",monospace;fill:var(--muted)}
.n-tag{font-size:10px;font-family:"IBM Plex Mono",monospace;letter-spacing:.05em}

.st-done .node-edge,.st-done .node-halo{stroke:var(--sig)}
.st-partial .node-edge,.st-partial .node-halo{stroke:var(--gold)}
.st-planned .node-edge,.st-planned .node-halo{stroke:var(--dim)}
.st-planned .node-edge{stroke-dasharray:3 6}
.st-gap .node-edge,.st-gap .node-halo{stroke:var(--alarm)}
.st-ref .node-edge,.st-ref .node-halo{stroke:var(--violet)}
.st-done .n-tag{fill:var(--sig)} .st-partial .n-tag{fill:var(--gold)}
.st-planned .n-tag{fill:var(--dim)} .st-gap .n-tag{fill:var(--alarm)} .st-ref .n-tag{fill:var(--violet)}

.edge{fill:none;stroke-width:1.6;opacity:.75}
.edge.pii{stroke:var(--pii)}
.edge.sig{stroke:var(--sig)}
.edge.ctl{stroke:var(--dim);stroke-dasharray:4 5}
.edge.loop{stroke:var(--violet);stroke-dasharray:6 5;opacity:.6}
.edge.dimmed{opacity:.13}
.edge-label{
  font-size:10.6px;font-family:"IBM Plex Mono",monospace;fill:#9BBAC7;
  paint-order:stroke fill;stroke:var(--ink);stroke-width:4px;stroke-linejoin:round;
  pointer-events:none;
}
.pkt{opacity:0}
.animate .pkt{opacity:1}

.boundary{stroke:var(--alarm);stroke-width:2;stroke-dasharray:9 7;opacity:.85}
.animate .boundary{animation:ants 3.4s linear infinite}
.boundary-label{font-size:11.6px;font-family:"IBM Plex Mono",monospace;fill:var(--alarm);letter-spacing:.07em}

.axis{stroke:var(--stroke);stroke-width:1.4}
.tick{stroke:rgba(32,67,83,.85);stroke-width:1}
.tick-label{
  font-size:11px;font-family:"IBM Plex Mono",monospace;fill:var(--dim);
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.4px;stroke-linejoin:round;
}
.today{stroke:var(--sig);stroke-width:1.6;stroke-dasharray:5 5}
.today-label{
  font-size:11.4px;font-family:"IBM Plex Mono",monospace;fill:var(--sig);
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.6px;stroke-linejoin:round;
}
.dl-label{
  font-family:"IBM Plex Mono",monospace;
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.6px;stroke-linejoin:round;
}
.boundary-label{paint-order:stroke fill;stroke:var(--ink);stroke-width:3.6px;stroke-linejoin:round}

.bar-track{fill:rgba(0,0,0,.34);rx:5}
.bar-fill{rx:5}
.bar-label{font-size:12.4px;fill:#B9D3DD}
.bar-pct{
  font-size:11.4px;font-family:"IBM Plex Mono",monospace;fill:var(--muted);
  paint-order:stroke fill;stroke:var(--ink);stroke-width:3.2px;stroke-linejoin:round;
}

.heading{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600;fill:var(--text)}
.subheading{font-size:12px;fill:var(--dim);font-family:"IBM Plex Mono",monospace}

.legend-sw{rx:3}
.legend-tx{font-size:11.6px;fill:var(--muted)}

.faded{opacity:.16;transition:opacity .3s}
.node,.edge,.pkt,g.grp{transition:opacity .3s}

.reduced .node-edge,.reduced .boundary{animation:none!important}
.reduced .pkt{display:none}

@media (max-width:1080px){
  aside{width:310px}
}
@media (max-width:820px){
  body{overflow:auto}
  .stage{flex-direction:column}
  .canvas-wrap{height:62vh;flex:none}
  aside{width:auto;border-left:0;border-top:1px solid var(--stroke);max-height:none}
  header{gap:12px;padding:10px 14px}
  .brand span{display:none}
  .tools{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .node-edge,.boundary{animation:none!important}
  .pkt{display:none}
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand">
    <h1><span class="glyph">◈</span> ShadowTrace</h1>
    <span>Privacy-preserving anomaly detection for microservices · SDP 2026–27</span>
  </div>
  <nav role="tablist">
    <button role="tab" data-view="arch" aria-selected="true">Architecture</button>
    <button role="tab" data-view="prog" aria-selected="false">Progress</button>
    <button role="tab" data-view="pub" aria-selected="false">Publication</button>
  </nav>
  <div class="tools" id="tools"></div>
</header>

<div class="stage">
  <div class="canvas-wrap">
    <div class="view active" id="view-arch"><svg class="canvas" id="svg-arch"></svg></div>
    <div class="view" id="view-prog"><svg class="canvas" id="svg-prog"></svg></div>
    <div class="view" id="view-pub"><svg class="canvas" id="svg-pub"></svg></div>
    <div class="hint" id="hint">Click any box for detail · drag to pan · scroll to zoom</div>
    <div class="zoombar">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" class="wide" title="Fit to screen">Fit</button>
    </div>
  </div>
  <aside id="inspector"></aside>
</div>
</div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) {
    if (attrs[k] === null || attrs[k] === undefined) continue;
    n.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(n);
  return n;
};
const TODAY = new Date(2026, 8, 2); // 2 Sept 2026

/* =====================================================================
   VIEW 1 — ARCHITECTURE
   Two planes: the offline research pipeline (Semester 1, already measured)
   and the in-stream runtime system (Semester 2, engineered).
   ===================================================================== */

const NW = 246, NH = 82;
const N = (id, x, y, t, s, status, tag, plane, detail, opt) => Object.assign(
  {id, x, y, w: NW, h: NH, t, s, status, tag, plane, detail}, opt || {}
);

const archNodes = [
  /* ---------- RESEARCH PLANE ---------- */
  N("boutique", 60, 150, ["Google Online Boutique"], "11 polyglot microservices", "done", "M1 · DONE", "R", {
    what: "The target environment. Google's e-commerce benchmark, deployed on a single-node Minikube cluster, gives realistic multi-tier call paths without cloud cost.",
    where: "README.md → kubectl apply .../kubernetes-manifests.yaml",
    facts: [
      "11 services across Go, C#, Node.js, Python and Java",
      "<b>cartservice</b> patched to 512Mi — the stock 128Mi limit causes OOMKilled mid-run",
      "Google's built-in <b>loadgenerator</b> scaled to 0 replicas so only k6 produces telemetry",
      "Every deployment gets ENABLE_TRACING=1 and an explicit OTEL_SERVICE_NAME"
    ]
  }),
  N("k6norm", 60, 262, ["k6 — normal traffic"], "normal_traffic.js · 5 VUs · 2m", "done", "M2 · DONE", "R", {
    what: "Synthetic shopper workload: homepage → product → add to cart → checkout, with randomised 2–7 s think-time so inter-arrival timing is not artificially regular.",
    where: "k6_test/normal_traffic.js",
    facts: [
      "Human think-time jitter is deliberate — <b>temporal jitter</b> is one of the four detection features, so benign traffic must not look metronomic",
      "Runs against the port-forwarded frontend on :8080"
    ]
  }),
  N("k6atk", 60, 374, ["k6 — attack scenarios"], "5 classes · not yet written", "gap", "M2 · MISSING", "R", {
    what: "The five application-layer attack classes the detector must classify: HTTP flood, brute-force login, SQL-injection probe, SSRF-like probe, and exfiltration simulation.",
    where: "k6_test/ — only normal_traffic.js exists today",
    facts: [
      "Without these there is <b>no positive class</b>, so M3 cannot be trained or evaluated at all",
      "Brute-force is the critical one: Ma (2026) shows it collapses under topology-only models because the call path (frontend→auth) is two nodes and one edge, identical to a real login",
      "This is currently the single hardest blocker on the critical path"
    ],
    note: "Blocks M3."
  }),
  N("otelsdk", 366, 150, ["OTel auto-instrumentation"], "SDK in every service", "done", "M1 · DONE", "R", {
    what: "OpenTelemetry SDKs inside each service emit spans carrying traceId, spanId and parentSpanId — the raw material the whole framework is built on.",
    where: "README.md → kubectl set env deployment/… OTEL_EXPORTER_OTLP_ENDPOINT",
    facts: [
      "Fidelity-first by design: span attributes routinely carry headers, query params and DB statements",
      "That default is exactly the privacy problem the project measures"
    ]
  }),
  N("otlp", 366, 262, ["OTLP transport"], "gRPC :4317 · HTTP :4318", "done", "M1 · DONE", "R", {
    what: "Vendor-neutral wire protocol carrying telemetry from pods in Minikube to the host collector via host.minikube.internal.",
    where: "collector/config.yaml → receivers.otlp (0.0.0.0 binding)",
    facts: ["gRPC 4317 for service-to-collector, HTTP 4318 for web ingest"]
  }),
  N("jaeger", 672, 150, ["Jaeger all-in-one"], "UI :16686 · REST /api/traces", "done", "M1 · DONE", "R", {
    what: "Trace store and query layer. The UI is for eyeballing call paths; the REST API is what actually matters, because the harvester reads from it.",
    where: "docker-compose.yml → jaegertracing/all-in-one",
    facts: ["COLLECTOR_OTLP_ENABLED=true exposes 4317/4318 directly on Jaeger"]
  }),
  N("collector", 672, 274, ["OTel Collector (contrib)"], "otlp → file exporter", "gap", "NO PROCESSORS", "R", {
    what: "The collector runs, but its pipeline is receiver → exporter with nothing in between. The Privacy Layer — the entire point of the framework — does not exist in the pipeline yet.",
    where: "collector/config.yaml",
    facts: [
      "Current pipeline: <code>traces: receivers[otlp] → exporters[file]</code>",
      "No <code>processors:</code> key is defined at all",
      "This is the slot the Semester 2 Go processor drops into — it is intentionally empty for now, but worth naming plainly rather than implying the privacy layer is live"
    ],
    note: "Placeholder for M5."
  }),
  N("harvest", 978, 150, ["harvest_traces.py"], "Jaeger REST · --target 500", "done", "M2 · DONE", "R", {
    what: "Automated harvester. Queries /api/services for the live service list, then /api/traces per service with a 1-hour lookback, writing each trace to its own JSON file.",
    where: "scripts/harvest_traces.py",
    facts: ["Verified end-to-end", "Target of 500 traces reached and committed"]
  }),
  N("traces", 978, 274, ["data/raw_traces/"], "500 trace JSON files", "partial", "M2 · UNLABELLED", "R", {
    what: "The Semester 1 dataset. 500 harvested Jaeger traces, committed to the repository.",
    where: "data/raw_traces/trace_*.json",
    facts: [
      "500 files · <b>3,852 spans</b> · <b>2,758 parent→child edges</b> on re-run",
      "Only <b>5 distinct service nodes</b> resolve, and three of them are <code>unknown_service</code>, <code>unknown_service:server</code>, <code>unknown_service:checkoutservice</code>",
      "Roughly two thirds of spans therefore carry no usable service identity — and service identity <i>is</i> the node label in the DAG",
      "Nothing carries an attack label, so this dataset trains nothing yet"
    ],
    note: "Service-name resolution needs fixing before this data can back a claim."
  }),
  N("parse", 1284, 150, ["parse_traces.py"], "spans → DAG · w_ij", "done", "M2 · DONE", "R", {
    what: "Groups spans by traceId, walks CHILD_OF references, and builds a NetworkX DiGraph per trace with time-weighted edges.",
    where: "analytics/parse_traces.py",
    facts: [
      "Edge weight <code>w_ij = T_start(child) − T_start(parent)</code>, clamped at 0",
      "Measured on the committed dataset: avg span duration <b>17.58 ms</b>, avg inter-service latency <b>96.44 ms</b>",
      "Note the report defines w_ij as T_end(child) − T_start(parent); the code uses start-to-start. Pick one before the numbers go in the paper."
    ],
    note: "Definition mismatch between report and code."
  }),
  N("audit", 1284, 274, ["privacy_entropy_audit.py"], "H(X) ≥ 3.5 · PII regex", "done", "RQ1 · DONE", "R", {
    what: "The empirical answer to RQ1: how much sensitive material does default OTel instrumentation actually leak? Shannon entropy plus four regex families, over both span tags and process metadata.",
    where: "analytics/privacy_entropy_audit.py",
    facts: [
      "<code>H(X) = −Σ p(xᵢ)·log₂ p(xᵢ)</code>, threshold τ = 3.5 bits/char",
      "Regex families: Email, JWT, Credit_Card, IPv4_Address",
      "Measured: <b>11,345 flagged attributes</b> across 500 traces (mean H = 3.52)",
      "<b>3,179</b> IPv4 hits — internal pod addressing, the reconnaissance surface named in the README",
      "Top leaking keys: otel.scope.name (3,147), rpc.method (2,843), server.address (2,574), net.peer.ip, process.command_args"
    ]
  }),
  N("chart", 1284, 398, ["privacy_leakage_chart.png"], "leakage per microservice", "done", "FIGURE", "R", {
    what: "Generated bar chart of flagged attributes per service — the figure that carries RQ1 in the paper.",
    where: "docs/diagrams/privacy_leakage_chart.png",
    facts: ["Regenerated by re-running the audit script", "Currently the x-axis inherits the unknown_service labels from the harvest gap"]
  }),
  N("gnn", 1590, 150, ["st_gnn_model.py"], "PyG · GCNConv ×2 → pool", "partial", "M3 · TEMPLATE", "R", {
    what: "The detector. Currently a spatial-only skeleton: two graph convolutions, global mean pooling, and a linear classifier.",
    where: "analytics/st_gnn_model.py",
    facts: [
      "<code>GCNConv(25→32) → ReLU → GCNConv(32→32) → global_mean_pool → Linear(32→2)</code>",
      "Missing the <b>temporal half</b> — no GRU or temporal-attention layer over the sliding window, so it is a GNN, not yet an ST-GNN",
      "No dataset loader, no training loop, no trial-level split, no Random Forest / MLP comparison",
      "The temporal component is not optional: it is the entire argument for beating Ma's 0.405 on brute-force"
    ],
    note: "The spatial half exists; the part that makes the thesis work does not."
  }),
  N("baseline", 1590, 274, ["Ma (2026) baseline"], "arXiv:2605.24283", "ref", "LITERATURE", "R", {
    what: "The empirical constraint the whole design answers to. Ma tests exactly the assumption ShadowTrace's privacy layer depends on — that call-path structure alone carries enough signal.",
    where: "Research Framework §5 · SSP Report §2.2",
    facts: [
      "Topology only, trial-level split: <b>Macro-F1 0.405</b>",
      "+ log features: 0.734 · + service metrics: 0.825",
      "Graph-level random split: 0.955 — flagged by the paper itself as optimistic leakage",
      "Random Forest and MLP on flattened features <b>beat</b> the shallow GCN under the honest split",
      "ShadowTrace target: <b>Macro-F1 ≥ 0.90</b> on redacted topology"
    ]
  }),

  /* ---------- RUNTIME PLANE ---------- */
  N("svc", 60, 790, ["Services + Envoy sidecars"], "Istio mesh · Kubernetes", "planned", "M6", "A", {

function anchors(a, b, mode){
  const ax = a.x, ay = a.y, aw = a.w, ah = a.h;
  const bx = b.x, by = b.y, bw = b.w, bh = b.h;
  let m = mode;
  if (!m){
    if (bx > ax + aw - 20) m = "RL";
    else if (bx + bw < ax + 20) m = "LR";
    else if (by > ay + ah - 20) m = "TB";
    else m = "BT";
  }
  switch(m){
    case "RL": return {x1:ax+aw, y1:ay+ah/2, x2:bx, y2:by+bh/2, dir:"h"};
    case "LR": return {x1:ax, y1:ay+ah/2, x2:bx+bw, y2:by+bh/2, dir:"h"};
    case "LR2": return {x1:ax, y1:ay+ah/2, x2:bx+bw, y2:by+bh/2, dir:"h"};
    case "TB": return {x1:ax+aw/2, y1:ay+ah, x2:bx+bw/2, y2:by, dir:"v"};
    case "BT": return {x1:ax+aw/2, y1:ay, x2:bx+bw/2, y2:by+bh, dir:"v"};
    case "RT": return {x1:ax+aw, y1:ay+ah/2, x2:bx+bw/2, y2:by+bh, dir:"h"};
    case "BB": return {x1:ax+aw/2, y1:ay+ah, x2:bx+bw/2, y2:by+bh, dir:"bb"};
    default: return {x1:ax+aw, y1:ay+ah/2, x2:bx, y2:by+bh/2, dir:"h"};
  }
}

function pathFor(a){
  if (a.dir === "h"){
    const sx = a.x2 >= a.x1 ? 1 : -1;
    const dx = Math.max(38, Math.abs(a.x2-a.x1)*0.45) * sx;
    return `M ${a.x1} ${a.y1} C ${a.x1+dx} ${a.y1}, ${a.x2-dx} ${a.y2}, ${a.x2} ${a.y2}`;
  }
  if (a.dir === "bb"){
    const drop = 74;
    return `M ${a.x1} ${a.y1} C ${a.x1} ${a.y1+drop}, ${a.x2} ${a.y2+drop}, ${a.x2} ${a.y2}`;
  }
  const sy = a.y2 >= a.y1 ? 1 : -1;
  const dy = Math.max(30, Math.abs(a.y2-a.y1)*0.5) * sy;
  return `M ${a.x1} ${a.y1} C ${a.x1} ${a.y1+dy}, ${a.x2} ${a.y2-dy}, ${a.x2} ${a.y2}`;
}

let pathSeq = 0;
function drawEdge(layerE, layerP, nodes, e, viewKey){
  const a = nodes[e.f], b = nodes[e.t];
  if (!a || !b) return;
  const an = anchors(a, b, e.a);
  const d = pathFor(an);
  const id = `pp_${viewKey}_${pathSeq++}`;
  const cross = e.k === "cross";
  const cls = cross ? "sig" : e.k;
  const p = el("path", {
    id, class:"edge " + cls, d,
    "marker-end": `url(#arw-${cross ? "sig" : (e.k === "pii" ? "pii" : e.k === "loop" ? "loop" : e.k === "sig" ? "sig" : "ctl")})`,
    "data-from": e.f, "data-to": e.t
  }, layerE);
  if (cross) p.setAttribute("stroke", `url(#grad-cross)`);

  if (e.lbl){
    const vertical = an.dir === "v";
    let lx = (an.x1 + an.x2)/2;
    let ly = (an.y1 + an.y2)/2 + (vertical ? 4 : (an.dir === "bb" ? 46 : -9));
    if (!vertical && an.dir !== "bb"){
      try {
        const L = p.getTotalLength();
        if (L > 0){ const pt = p.getPointAtLength(L * 0.5); lx = pt.x; ly = pt.y - 9; }
      } catch (err) {}
    }
    const tx = el("text", {class:"edge-label", x: vertical ? lx + 34 : lx, y:ly,
      "text-anchor": vertical ? "start" : "middle"}, layerE);
    tx.textContent = e.lbl;
  }

  if (e.k !== "ctl"){
    const dur = (2.6 + Math.random()*1.6).toFixed(2) + "s";
    const c = el("circle", {class:"pkt", r:3.4, fill: cross ? "var(--pii)" : (e.k === "pii" ? "var(--pii)" : e.k === "loop" ? "var(--violet)" : "var(--sig)")}, layerP);
    const am = el("animateMotion", {dur, repeatCount:"indefinite", begin:(Math.random()*2).toFixed(2)+"s", rotate:"auto"}, c);
    const mp = el("mpath", {}, am);
    mp.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#"+id);
    mp.setAttribute("href", "#"+id);
    if (cross){
      el("animate", {attributeName:"fill", values:"#FF8C42;#FF8C42;#4FE0C0;#4FE0C0",
        keyTimes:"0;0.44;0.56;1", dur, repeatCount:"indefinite"}, c);
      el("animate", {attributeName:"r", values:"4.2;4.2;2.6;2.6", keyTimes:"0;0.44;0.56;1", dur, repeatCount:"indefinite"}, c);
    }
  }
}

function defs(svg){
  const d = el("defs", {}, svg);
  [["pii","#FF8C42"],["sig","#4FE0C0"],["ctl","#4E7284"],["loop","#9F8BF5"]].forEach(([k,c])=>{
    const m = el("marker", {id:"arw-"+k, viewBox:"0 0 10 10", refX:"9", refY:"5",
      markerWidth:"7", markerHeight:"7", orient:"auto-start-reverse"}, d);
    el("path", {d:"M 0 0 L 10 5 L 0 10 z", fill:c, opacity:".9"}, m);
  });
  const g = el("linearGradient", {id:"grad-cross", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
  el("stop", {offset:"0%", "stop-color":"#FF8C42"}, g);
  el("stop", {offset:"46%", "stop-color":"#FF8C42"}, g);
  el("stop", {offset:"58%", "stop-color":"#4FE0C0"}, g);
  el("stop", {offset:"100%", "stop-color":"#4FE0C0"}, g);
  return d;
}

  // deadline axis
  const X0 = 110, X1 = 1900, AY = 250;
  const FROM = new Date(2026,7,10), TO = new Date(2027,4,10);
  el("line", {class:"axis", x1:X0, y1:AY, x2:X1, y2:AY}, gAx);
  for (let m = 0; m < 10; m++){
    const d = new Date(2026, 7+m, 1);
    if (d > TO) break;
    const x = dateX(d, X0, X1, FROM, TO);
    el("line", {class:"tick", x1:x, y1:AY-6, x2:x, y2:AY+6}, gAx);
    const t = el("text", {class:"tick-label", x:x, y:AY+22, "text-anchor":"middle"}, gAx);
    t.textContent = d.toLocaleString("en", {month:"short"}) + (d.getMonth() === 0 ? " ’27" : "");
  }
  const tx = dateX(TODAY, X0, X1, FROM, TO);
  el("line", {class:"today", x1:tx, y1:AY-46, x2:tx, y2:AY+30}, gAx);
  const tl = el("text", {class:"today-label", x:tx+9, y:AY-52}, gAx);
  tl.textContent = "2 Sep 2026";

  const dated = venues.filter(v => v.deadline).sort((a,b) => a.deadline - b.deadline);
  dated.forEach((v, i) => {
    const x = dateX(v.deadline, X0, X1, FROM, TO);
    const passed = v.deadline < TODAY;
    const c = passed ? "var(--alarm)" : (v.id === "popets" ? "var(--sig)" : "var(--gold)");
    const lvl = [-84, 82, -128, 126][i % 4];
    const up = lvl < 0;
    const ey = AY + lvl;
    el("line", {x1:x, y1:up ? AY-6 : AY+6, x2:x, y2:ey + (up ? 26 : -8), stroke:c, "stroke-width":1.2, opacity:".7"}, gAx);
    el("circle", {cx:x, cy:AY, r:4.5, fill:c}, gAx);
    const lab = el("text", {class:"dl-label", x:x, y:ey+ (up ? 18 : 0), "text-anchor":"middle",
      "font-size":"12.4", fill:c,
      "text-decoration": passed ? "line-through" : "none"}, gAx);
    lab.textContent = v.name;
    const d2 = el("text", {class:"dl-label", x:x, y:ey + (up ? 34 : 16), "text-anchor":"middle",
      "font-size":"10.8", fill:"var(--dim)"}, gAx);
    d2.textContent = passed ? "closed" : v.deadline.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
  });

  // decision flow
  const fh = el("text", {class:"heading", x:60, y:448}, gAx);
  fh.textContent = "Sequence";
  const fs = el("text", {class:"subheading", x:60, y:470}, gAx);
  fs.textContent = "One venue at a time. If rejected, drop to the next tier — never parallel-submit the same manuscript.";

  const fmap = {};
  const fx = [60, 460, 860, 860, 1260];
  const fy = [508, 508, 508, 620, 564];
  pubFlow.forEach((f, i) => {
    const n = {id:f.id, x:fx[i], y:fy[i], w:330, h:86, status:f.status, t:f.t, s:f.s, tag:f.tag, detail:f.detail};
    fmap[f.id] = n; nodeIndex[f.id] = n;
  });
  [{f:"f1",t:"f2",k:"sig"},{f:"f2",t:"f3",k:"sig"},{f:"f2",t:"f4",k:"ctl"},
   {f:"f3",t:"f5",k:"sig"},{f:"f4",t:"f5",k:"ctl"}].forEach(e => drawEdge(gE, gP, fmap, e, "u"));
  pubFlow.forEach(f => drawNode(gN, fmap[f.id]));

  // constraint callout
  const cx = 1640, cy = 508;
  el("rect", {class:"group-frame", x:cx, y:cy, width:300, height:200, rx:12,
    stroke:"var(--alarm)", "stroke-dasharray":"6 5", fill:"rgba(255,95,109,.05)"}, gN);
  const c1 = el("text", {x:cx+18, y:cy+32, class:"n-title", fill:"var(--alarm)"}, gN);
  c1.textContent = "Single-submission rule";
  ["A manuscript may sit at exactly one","venue at a time. The workshop paper","(architecture only) and the journal","paper (full empirical) are different","scopes, so those two do not conflict.","PoPETs and Computers & Security","are sequential, never parallel."].forEach((ln, i) => {
    const t = el("text", {x:cx+18, y:cy+60+i*20, "font-size":"12.4", fill:"#B9D3DD"}, gN);
    t.textContent = ln;
  });

  // venue columns
  const cols = [
    {tier:1, x:60,   title:"Tier 1 — journals", note:"no travel required · rolling"},
    {tier:2, x:540,  title:"Tier 2 — remote-friendly conferences", note:"confirmed hybrid or online-author track"},
    {tier:3, x:1020, title:"Tier 3 — open deadlines", note:"remote policy unconfirmed — ask after acceptance"},
    {tier:4, x:1500, title:"Watchlist — 2027 calls", note:"strong topical fit, deadlines already passed"}
  ];
  cols.forEach(c => {
    const t = el("text", {class:"heading", x:c.x, y:786, "font-size":"14.5"}, gN);
    t.textContent = c.title;
    const s = el("text", {class:"subheading", x:c.x, y:806, "font-size":"11.4"}, gN);
    s.textContent = c.note;
    const list = venues.filter(v => v.tier === c.tier);
    list.forEach((v, i) => {
      const y = 836 + i*86;
      const passed = v.deadline && v.deadline < TODAY;
      const st = passed ? "gap"
        : v.id === "popets" ? "done"
        : !v.costOk ? "partial"
        : c.tier === 4 ? "planned" : (c.tier === 1 ? "done" : "partial");
      const n = {id:"v_"+v.id, x:c.x, y, w:420, h:72, status:st,
        t:[v.name], s:v.dl + " · " + v.cost, tag:passed ? "CLOSED" : v.fit.toUpperCase(),
        venue:v,
        detail:{
          what:v.full,
          where:v.dl + " · cost to author: " + v.cost + " · travel: " + v.travel,
          facts:v.detail, url:v.url
        }};
      nodeIndex[n.id] = n;
      const g = drawNode(gN, n);
      g.setAttribute("data-venue", v.id);
      g.setAttribute("data-cost", v.costOk ? "free" : "paid");
      g.setAttribute("data-travel", v.travelOk ? "ok" : "unknown");
      g.setAttribute("data-open", (!v.deadline || v.deadline >= TODAY) ? "open" : "closed");
    });
  });
  return svg;
}

function select(n){
  document.querySelectorAll(".node.sel").forEach(e => e.classList.remove("sel"));
  const g = document.querySelector(`.node[data-id="${n.id}"]`);
  if (g) g.classList.add("sel");
  state.sel = n.id;
  renderInspector(n);
}

function renderInspector(n){
  const d = n.detail || {};
  const sm = statusMeta(n.status);
  let html = "";
  html += `<h2>${(n.t || []).join(" ")}</h2>`;
  if (d.where) html += `<div class="i-kicker">${d.where}</div>`;
  html += `<div class="i-status" style="color:${sm.c}"><i></i>${sm.l}${n.tag && n.tag !== sm.l.toUpperCase() ? " · " + n.tag : ""}</div>`;
  if (d.what) html += `<p>${d.what}</p>`;
  if (typeof d.pct === "number"){
    html += `<div class="metric"><span>Completion</span><span>${d.pct}%</span></div>`;
  }
  if (n.note) html += `<div class="metric"><span>Flag</span><span style="color:var(--alarm)">${n.note}</span></div>`;
  if (d.facts && d.facts.length){
    html += `<div class="lab">DETAIL</div><ul>`;
    d.facts.forEach(f => html += `<li>${f}</li>`);
    html += `</ul>`;
  }
  if (d.url) html += `<div class="lab">LINK</div><p><a href="${d.url}" target="_blank" rel="noopener">${d.url.replace(/^https?:\/\//,"")}</a></p>`;
  inspector.innerHTML = html;
  inspector.scrollTop = 0;
}

   ===================================================================== */

const cams = {};
function setupCamera(key, svg, W, H){
  const cam = {x:0, y:0, k:1, W, H, svg};
  cams[key] = cam;
  const apply = () => svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${cam.W/cam.k} ${cam.H/cam.k}`);
  cam.apply = apply;
  cam.fitAll = () => { cam.k = 1; cam.x = 0; cam.y = 0; cam.H = H; apply(); };
  cam.fitTo = (x, y, w, h) => {
    const r = svg.getBoundingClientRect();
    const ar = r.width / Math.max(1, r.height);
    let vw = w, vh = h;
    if (vw / vh < ar) vw = vh * ar; else vh = vw / ar;
    cam.k = W / vw;
    cam.x = x - (vw - w)/2;
    cam.y = y - (vh - h)/2;
    cam.H = vh * cam.k;
    apply();
  };
  cam.reset = () => { cam.k = 1; cam.x = 0; cam.y = 0; cam.H = H; apply(); };
  cam.fitWidth = () => {
    const r = svg.getBoundingClientRect();
    const ar = (r.width || 1200) / Math.max(1, r.height || 700);
    cam.k = 1; cam.x = 0; cam.y = 0; cam.H = Math.min(H, W / ar); apply();
  };

  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest(".node")) return;
    drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y};
    svg.classList.add("dragging");
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const sx = (cam.W/cam.k) / r.width, sy = (cam.H/cam.k) / r.height;
    cam.x = drag.cx - (e.clientX - drag.x) * sx;
    cam.y = drag.cy - (e.clientY - drag.y) * sy;
    apply();
  });
  const stop = e => { drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width, my = (e.clientY - r.top) / r.height;
    const wx = cam.x + mx * cam.W/cam.k, wy = cam.y + my * cam.H/cam.k;
    const f = e.deltaY < 0 ? 1.14 : 1/1.14;
    cam.k = Math.max(0.42, Math.min(4.5, cam.k * f));
    cam.x = wx - mx * cam.W/cam.k;
    cam.y = wy - my * cam.H/cam.k;
    apply();
  }, {passive:false});
  svg.addEventListener("click", e => {
    if (e.target.closest(".node")) return;
    document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel"));
    state.sel = null;
    clearInspector(currentView);
  });
  return cam;
}

const TOOLBARS = {
  arch: [
    {id:"plane-both", label:"Both planes", group:"plane", on:true},
    {id:"plane-R", label:"Research only", group:"plane"},
    {id:"plane-A", label:"Runtime only", group:"plane"},
    {sep:true},
    {id:"flow", label:"Data flow", toggle:true, on:true},
    {id:"motion", label:"Motion", toggle:true, on:true}
  ],
  prog: [
    {id:"motion", label:"Motion", toggle:true, on:true}
  ],
  pub: [
    {id:"f-all", label:"All venues", group:"filter", on:true},
    {id:"f-free", label:"$0 only", group:"filter"},
    {id:"f-open", label:"Deadline still open", group:"filter"},
    {sep:true},
    {id:"motion", label:"Motion", toggle:true, on:true}
  ]
};

function buildToolbar(view){
  const bar = document.getElementById("tools");
  bar.innerHTML = "";
  TOOLBARS[view].forEach(spec => {
    if (spec.sep){
      const s = document.createElement("span");
      s.style.cssText = "width:1px;height:20px;background:var(--stroke);margin:0 2px";
      bar.appendChild(s);
      return;
    }
    const b = document.createElement("button");
    b.className = "chip" + (spec.id === "flow" ? " warn" : "");
    b.textContent = spec.label;
    b.dataset.id = spec.id;
    b.setAttribute("aria-pressed", spec.on ? "true" : "false");
    if (spec.id === "motion") b.setAttribute("aria-pressed", state.motion ? "true" : "false");
    if (spec.id === "flow") b.setAttribute("aria-pressed", state.flow ? "true" : "false");
    b.addEventListener("click", () => {
      if (spec.group){
        bar.querySelectorAll(`.chip`).forEach(o => {
          const os = TOOLBARS[view].find(x => x.id === o.dataset.id);
          if (os && os.group === spec.group) o.setAttribute("aria-pressed", "false");
        });
        b.setAttribute("aria-pressed", "true");
        if (spec.group === "plane") setPlane(spec.id.replace("plane-",""));
        if (spec.group === "filter") setFilter(spec.id.replace("f-",""));
      } else {
        const now = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", now ? "true" : "false");
        if (spec.id === "motion") setMotion(now);
        if (spec.id === "flow") setFlow(now);
      }
    });
    bar.appendChild(b);
  });
}

function setMotion(on){
  state.motion = on;
  document.body.classList.toggle("reduced", !on);
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("animate", on));
}
function setFlow(on){
  state.flow = on;
  document.querySelectorAll("#svg-arch .pkt").forEach(p => p.style.display = on ? "" : "none");
  document.querySelectorAll("#svg-arch .edge").forEach(p => p.style.opacity = on ? "" : ".22");
}
function setPlane(p){
  state.plane = p;
  const svg = document.getElementById("svg-arch");
  archNodes.forEach(n => {
    const g = svg.querySelector(`.node[data-id="${n.id}"]`);
    if (!g) return;
    g.classList.toggle("faded", p !== "both" && n.plane !== p);
  });
  svg.querySelectorAll(".edge").forEach(e => {
    const a = nodeIndex[e.dataset.from], b = nodeIndex[e.dataset.to];
    const vis = p === "both" || (a && b && (a.plane === p || b.plane === p));
    e.classList.toggle("dimmed", !vis);
  });
  const cam = cams.arch;
  if (p === "R") cam.fitTo(10, 40, 1960, 500);
  else if (p === "A") cam.fitTo(10, 630, 1960, 600);
  else cam.fitWidth();
}
function setFilter(f){
  state.filter = f;
  const svg = document.getElementById("svg-pub");
  svg.querySelectorAll("[data-venue]").forEach(g => {
    let show = true;
    if (f === "free") show = g.dataset.cost === "free";
    if (f === "open") show = g.dataset.open === "open";
    g.classList.toggle("faded", !show);
  });
}

const svgA = buildArch();
const svgP = buildProg();
const svgU = buildPub();
setupCamera("arch", svgA, ARCH_W, ARCH_H);
setupCamera("prog", svgP, PROG_W, PROG_H);
setupCamera("pub", svgU, PUB_W, PUB_H);

document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(o => o.setAttribute("aria-selected", "false"));
    b.setAttribute("aria-selected", "true");
    currentView = b.dataset.view;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + currentView).classList.add("active");
    buildToolbar(currentView);
    clearInspector(currentView);
    document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel"));
    cams[currentView].fitWidth();
    document.getElementById("hint").textContent =
      currentView === "arch" ? "Click any box for detail · drag to pan · scroll to zoom"
      : currentView === "prog" ? "Click a milestone or a blocker for the evidence behind it"
      : "Click a venue for its true cost, deadline and travel policy";
  });
});

["zin","zout","zfit"].forEach(id => {
  document.getElementById(id).addEventListener("click", () => {
    const cam = cams[currentView];
    if (id === "zfit"){ cam.fitAll ? cam.fitAll() : cam.reset(); return; }
    cam.k = Math.max(0.42, Math.min(4.5, cam.k * (id === "zin" ? 1.22 : 1/1.22)));
    cam.apply();
  });
});

const reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
setMotion(!reduced);
buildToolbar("arch");
clearInspector("arch");
requestAnimationFrame(() => { Object.values(cams).forEach(c => c.fitWidth()); });
window.addEventListener("resize", () => { if (cams[currentView]) cams[currentView].fitWidth(); });
</script>
